<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>Greeny · Will your plant survive?</title>
  <link rel="stylesheet" href="style.css?v=a168bf572c9989ea">
  <script src="plants.js?v=fe8d8d6168b938dc" defer></script>
  <script src="translations.js?v=dac6b967745be508" defer></script>
  <script src="score.js?v=9ff19949a16ffba3" defer></script>
  <script src="search.js?v=4aa11357ff14032f" defer></script>
  <script src="script.js?v=78494a2923c429e5" defer></script>
</head>
<body>
  <main class="app">
    <header class="topbar"><h1 class="brand"><a href="./">Greeny</a></h1><button id="language" class="language" type="button">FR / EN</button></header>
    <section class="intro"><p class="subtitle" data-i18n="subtitle"></p></section>
    <form id="conditions" class="card">
      <label id="plantLabel" for="plantSearch" data-i18n="plant"></label>
      <div class="plant-search">
        <div class="search-field">
          <input id="plantSearch" type="text" role="combobox" aria-autocomplete="list" aria-expanded="false" aria-controls="plantSuggestions" aria-describedby="searchHint botanical searchStatus" autocomplete="off" spellcheck="false" required>
          <button id="clearSearch" type="button" hidden>×</button>
        </div>
        <ul id="plantSuggestions" role="listbox" aria-labelledby="plantLabel" hidden></ul>
      </div>
      <p id="searchHint" class="sr-only" data-i18n="searchHint"></p>
      <p id="botanical" class="hint"></p>
      <p id="searchStatus" class="hint" role="status"></p>
      <label for="water" data-i18n="water"></label><select id="water" name="water" required aria-describedby="waterHint"></select>
      <p id="waterHint" class="hint"></p>
      <label for="light" data-i18n="light"></label><select id="light" name="light" required aria-describedby="lightHint"><option value="" disabled selected data-i18n="chooseLight"></option><option value="low" data-i18n="low"></option><option value="indirect" data-i18n="indirect"></option><option value="partial" data-i18n="partial"></option><option value="sun" data-i18n="sun"></option></select>
      <p id="lightHint" class="hint" data-i18n="lightHint"></p>
      <label for="drainage" data-i18n="drainage"></label><select id="drainage" name="drainage" aria-describedby="drainageHint"><option value="drained" data-i18n="drained"></option><option value="wet" data-i18n="wet"></option><option value="unknown" selected data-i18n="unknown"></option></select>
      <p id="drainageHint" class="hint" data-i18n="drainageHint"></p>
      <button class="primary" type="submit" data-i18n="calculate"></button>
      <p id="resultNotice" class="hint" hidden><a href="#result" data-i18n="seeResult"></a></p>
    </form>
    <section id="result" class="result card" aria-labelledby="resultTitle" hidden>
      <div id="verdictSummary">
        <h2 id="resultTitle"></h2>
        <p class="score-label" data-i18n="scoreLabel"></p>
        <div class="score" aria-hidden="true">0%</div>
        <span id="accessibleScore" class="sr-only"></span>
        <p class="hint" data-i18n="scoreHint"></p>
        <p id="resultLevel"></p>
        <span class="emoji" aria-hidden="true">🌿</span><p class="message"></p>
      </div>
      <button id="shareBtn" type="button" class="share-btn" data-i18n="share"></button>
      <p id="shareStatus" role="status"></p>
      <textarea id="shareFallback" readonly hidden aria-label="Share text"></textarea>
      <div class="care-advice"><div class="priority"><h3 id="priorityTitle"></h3><p id="priorityAction"></p></div><h3 id="otherAdviceTitle" data-i18n="adviceTitle"></h3><ul class="reason"></ul>
      <a id="source" target="_blank" rel="noopener noreferrer" data-i18n="source"></a></div>
    </section>
    <p id="resultAnnouncement" class="sr-only" role="status" aria-atomic="true"></p>
    <footer><p class="disclaimer" data-i18n="disclaimer"></p><p class="credits" data-i18n="credits"></p></footer>
  </main>
</body>
</html>
